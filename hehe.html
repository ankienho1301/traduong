
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>emiucuaankienho</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffc0cb, #ff69b4, #ffb6c1);
    text-align: center;
}

h1 {
    color: white;
    text-shadow: 2px 2px 5px #ff1493;
}

.heart {
    font-size: 130px;
    animation: beat 0.8s infinite;
    cursor: pointer;
    user-select: none;
    filter: drop-shadow(0 0 20px hotpink);
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

p {
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 0 15px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 13px 22px;
    margin: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px #0002;
}

#yes {
    background: #ff1744;
    color: white;
}

#no {
    background: white;
    color: #ff1744;
}

#message {
    min-height: 30px;
    margin-top: 15px;
    color: white;
    font-weight: bold;
    font-size: 20px;
}

.floating {
    position: absolute;
    bottom: -30px;
    animation: fly 4s linear forwards;
    pointer-events: none;
}

@keyframes fly {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>💌 GỬI CỤC CƯNG 💌</h1>

<div class="heart" onclick="heartClick()">❤️</div>

<p id="caption">Oi! Công chúa đánh cắp chái timk anh gòi</p>

<div>
    <button id="yes" onclick="love()">💋 Hôn một cái</button>
    <button id="no" onclick="runAway()">🙄 Không yêu đâu</button>
</div>

<div id="message"></div>

<script>
const captions = [
    "Em là wifi, anh là điện thoại 📱",
    "Không có em, đời anh như code thiếu dấu ;",
    "Em có biết anh thiếu gì không? Thiếu em đó!",
    "Tim anh chạy 220V, gặp em là chập mạch ⚡",
    "Yêu em là nhiệm vụ, chiều em là KPI",
    "Em là bug duy nhất anh không muốn fix 💗"
];

function heartClick() {
    document.getElementById("caption").textContent =
        captions[Math.floor(Math.random() * captions.length)];

    for (let i = 0; i < 5; i++) {
        createHeart();
    }
}

function love() {
    document.getElementById("message").textContent =
        "ÁAAAAA 😳 HÔN RỒI KHÔNG ĐƯỢC CHẠY ĐÂU NHA!!!";

    document.getElementById("caption").textContent =
        "Đã nhận nụ hôn. Đang lưu vào bộ nhớ vĩnh viễn 💾❤️";

    for (let i = 0; i < 25; i++) {
        setTimeout(createHeart, i * 80);
    }
}

function runAway() {
    const btn = document.getElementById("no");

    btn.style.position = "fixed";

    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    btn.style.left = Math.random() * Math.max(0, maxX) + "px";
    btn.style.top = Math.random() * Math.max(0, maxY) + "px";

    document.getElementById("message").textContent =
        "BẤM GÌ KHÓ COI DỢ, CHO CHỌN LẠI Ớ 🤨";
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating";
    heart.textContent = ["❤️", "💖", "💕", "💗", "😘"][
        Math.floor(Math.random() * 5)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 30) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
}

// Mưa tim tự động
setInterval(createHeart, 400);
</script>

</body>
</html>
